[project]
name = "meeting-avatar"
version = "0.1.0"
description = "会议数字人：像同事一样参加当面会议和线上会议"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "sherpa-onnx>=1.10.30",
    "edge-tts>=6.1.12",
    "httpx>=0.27",
    "pypinyin>=0.50",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: 需要真实的 Claude、网络或模型，默认不跑"]
addopts = "-m \"not live\""

# 官方源在这台机器的网络下经常连不上，默认用国内镜像
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

